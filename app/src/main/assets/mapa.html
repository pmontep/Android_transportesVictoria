<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
        }
        #mapa {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="mapa"></div>

    <script>
        let lat = 14.655648385822944;
        let lng = -90.45099620906228;
        let titulo = "Ubicación";

        window.initMapa = function() {
            console.log("initMapa ejecutado");

            if (window.mapaConfig) {
                lat = window.mapaConfig.lat;
                lng = window.mapaConfig.lng;
                titulo = window.mapaConfig.titulo;
            }

            const mapaDiv = document.getElementById('mapa');

            // Crear iframe de Google Maps
            const iframe = document.createElement('iframe');
            iframe.width = '100%';
            iframe.height = '100%';
            iframe.frameborder = '0';
            iframe.style.border = '0';
            iframe.allowfullscreen = '';
            iframe.loading = 'lazy';

            const mapsUrl = `https://www.google.com/maps/embed/v1/place?key=AIzaSyAa2QMW0W3K9FKOdqKLKWfzydO_5eWYpzc&q=${lat},${lng}`;
            iframe.src = mapsUrl;

            mapaDiv.innerHTML = '';
            mapaDiv.appendChild(iframe);

            console.log("Mapa Google Maps cargado");
        };

        // Ejecutar cuando esté listo
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', window.initMapa);
        } else {
            window.initMapa();
        }

        // Fallback
        setTimeout(function() {
            if (!document.querySelector('iframe')) {
                window.initMapa();
            }
        }, 1000);
    </script>
</body>
</html>
